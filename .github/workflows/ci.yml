name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Linux GUI / Xvfb dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxrender1 libxtst6 libxi6 libgl1 libglx-mesa0

      - name: Run Maven Verify (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd clean verify --no-transfer-progress

      - name: Run Maven Verify with Xvfb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./mvnw clean verify --no-transfer-progress
